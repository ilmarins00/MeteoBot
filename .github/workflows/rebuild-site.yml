name: MeteoBot - Aggiorna dati sito (senza AI/notifiche)

# Rigenera docs/site_data.json usando scripts/rebuild_site_data.py (nessuna
# chiamata Gemini, nessun messaggio Telegram: solo dati per il sito pubblico
# su GitHub Pages). Il bollettino completo con analisi AI resta gestito da
# previsioni.yml, che sovrascrive comunque lo stesso file quando gira.
#
# ── Configurazione cronjob.org ─────────────────────────────────────────────
# Method : POST
# URL    : https://api.github.com/repos/ilmarins00/MeteoBot/actions/workflows/rebuild-site.yml/dispatches
# Headers:
#   Accept        : application/vnd.github+json
#   Authorization : Bearer <GITHUB_PAT>
#   X-GitHub-Api-Version: 2022-11-28
# Body (JSON):
#   {"ref": "main"}
# Interval: ogni 10-15 minuti
# ──────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:

concurrency:
  group: rebuild-site-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Rigenera docs/site_data.json
        run: python scripts/rebuild_site_data.py

      - name: Commit ed effettua il push dei dati aggiornati
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            cp docs/site_data.json /tmp/local_site.json
            git reset --hard origin/main
            mkdir -p docs
            cp /tmp/local_site.json docs/site_data.json
            git add docs/site_data.json
            if git diff --cached --quiet; then
              echo "Nessuna modifica da committare"
              exit 0
            fi
            git commit -m "Aggiorna dati sito (automatico) [skip ci]"
            if git push; then
              echo "Push riuscito (tentativo $attempt)"
              exit 0
            fi
            echo "Push rifiutato, ritento ($attempt/5)..."
            sleep $((attempt * 2))
          done
          echo "Push fallito dopo 5 tentativi"
          exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
