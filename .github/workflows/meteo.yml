name: Generazione Bollettino Meteo La Spezia

on:
  schedule:
    # Gira ogni giorno alle 05:00 UTC (ovvero le 07:00 italiane estive o 06:00 solari)
    # Perfetto per avere il bollettino fresco al mattino basato sui run notturni
    - cron: '0 5 * * *'
  workflow_dispatch:
    # Ti permette di avviare lo script manualmente premendo un tasto su GitHub se vuoi fare un test

jobs:
  run-meteo-script:
    runs-on: ubuntu-latest

    steps:
    - name: Esamina il codice del repository
      uses: actions/checkout@v4

    - name: Configura Python
      uses: actions/setup-python@v5
      with:
        python-node-version: '3.10'

    - name: Installa le dipendenze
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Esegui lo Script Meteo
      env:
        # Inietta i Secrets di GitHub dentro le variabili d'ambiente dello script
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: previsioni.py